name: Build MacTrackpad APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Auto-Fix Folder Structure & Multi-Line Strings
        run: |
          if [ -d "MacTrackpad" ] && [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            cp -rn MacTrackpad/* .
          fi
          python3 - << 'EOF'
          import pathlib, re
          for kt in pathlib.Path(".").rglob("*.kt"):
              txt = kt.read_text(encoding="utf-8")
              fixed = re.sub(r'"([^"]*)\n" \+', r'"\1\\n" +', txt)
              if fixed != txt:
                  kt.write_text(fixed, encoding="utf-8")
                  print(f"Fixed multi-line strings in {kt}")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTrackpad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
